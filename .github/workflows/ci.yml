name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Podman
        shell: bash
        run: |
          set -euo pipefail
          command -v podman
          podman --version
          rootless=$(podman info --format '{{.Host.Security.Rootless}}')
          [[ "${rootless}" == true ]]

      - name: Resolve diff base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          diff_base=$(./scripts/resolve_ci_diff_base.sh \
            "${GITHUB_WORKSPACE}" \
            "${EVENT_NAME}" \
            "${PR_BASE_SHA}" \
            "${PR_BASE_REF}" \
            "${PUSH_BEFORE_SHA}")
          printf 'base=%s\n' "${diff_base}" >>"${GITHUB_OUTPUT}"

      - name: Build, test, and inspect installation
        timeout-minutes: 45
        env:
          CI: "true"
          CI_DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: ./scripts/container.sh check

      - name: Run sanitizer suite
        timeout-minutes: 45
        run: ./scripts/container.sh sanitize
