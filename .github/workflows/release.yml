name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      expected_commit: ${{ steps.release_identity.outputs.commit }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          command -v podman
          podman --version
          rootless=$(podman info --format '{{.Host.Security.Rootless}}')
          [[ "${rootless}" == true ]]

      - name: Validate tag and capture immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate_release_tag.sh "${GITHUB_REF_NAME}" CMakeLists.txt
          tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          checkout_commit=$(git rev-parse HEAD)
          [[ "${tag_commit}" == "${checkout_commit}" ]]
          [[ ${tag_commit} =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          source_date_epoch=$(git show -s --format=%ct "${tag_commit}")
          [[ ${source_date_epoch} =~ ^[0-9]+$ ]]
          (( source_date_epoch <= 253402300799 ))
          printf 'commit=%s\n' "${tag_commit}" >>"${GITHUB_OUTPUT}"
          printf 'SOURCE_DATE_EPOCH=%s\n' "${source_date_epoch}" >>"${GITHUB_ENV}"

      - name: Build, test, and inspect installation
        timeout-minutes: 50
        env:
          CI: "true"
          CI_DIFF_BASE: ROOT
        run: ./scripts/container.sh check

      - name: Run sanitizer suite
        timeout-minutes: 50
        run: ./scripts/container.sh sanitize

      - name: Package reproducible release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_OUTPUT=${GITHUB_WORKSPACE}/build-release-assets
          mkdir -m 0755 -- "${RELEASE_OUTPUT}"
          printf 'RELEASE_OUTPUT=%s\n' "${RELEASE_OUTPUT}" >>"${GITHUB_ENV}"
          ./scripts/container.sh release-package "${GITHUB_REF_NAME}" "${RELEASE_OUTPUT}"
          archive="remmina-krunner-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          checksum="${archive}.sha256"
          expected=$(printf '%s\n' "${archive} f" "${checksum} f")
          actual=$(find "${RELEASE_OUTPUT}" -mindepth 1 -maxdepth 1 -printf '%f %y\n' | LC_ALL=C sort)
          [[ "${actual}" == "${expected}" ]]
          (cd -- "${RELEASE_OUTPUT}" && sha256sum --check "${checksum}")

      - name: Transfer verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_OUTPUT }}/remmina-krunner-${{ github.ref_name }}-linux-x86_64.tar.gz
            ${{ env.RELEASE_OUTPUT }}/remmina-krunner-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out publication helper at verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.expected_commit }}

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets

      - name: Revalidate and create or update draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.expected_commit }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIRECTORY=${RUNNER_TEMP}/release-assets
          archive="remmina-krunner-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          checksum="${archive}.sha256"
          expected=$(printf '%s\n' "${archive} f" "${checksum} f")
          actual=$(find "${DOWNLOAD_DIRECTORY}" -mindepth 1 -maxdepth 1 -printf '%f %y\n' | LC_ALL=C sort)
          [[ "${actual}" == "${expected}" ]]
          (cd -- "${DOWNLOAD_DIRECTORY}" && sha256sum --check "${checksum}")
          ./scripts/publish_release.sh \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${DOWNLOAD_DIRECTORY}" \
            "${EXPECTED_COMMIT}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
